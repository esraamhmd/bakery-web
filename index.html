<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SoSo Bakery - freshly baked artisan breads, pastries and custom cakes. Order online for delivery or pickup." />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon" />
    <title>SoSo Bakery</title>

   
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

  
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        color: #333;
        background-image: url("/imgs/bg2.jpg");
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      header {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 72px;
        z-index: 1000;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
    </style>

    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&display=swap" /></noscript>

  
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" /></noscript>

   
    <link rel="preload" as="style"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></noscript>

  
    <link rel="preload" as="style"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" /></noscript>

   
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
